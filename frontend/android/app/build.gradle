apply plugin: 'com.android.application'

def signingPropertiesFile = rootProject.file('keystore.properties')
if (!signingPropertiesFile.exists()) {
    throw new GradleException('Missing frontend/android/keystore.properties; release signing cannot continue.')
}

def signingProperties = new Properties()
signingPropertiesFile.withInputStream { signingProperties.load(it) }

def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningProperties = requiredSigningProperties.findAll { key ->
    !signingProperties.getProperty(key)?.trim()
}
if (!missingSigningProperties.isEmpty()) {
    throw new GradleException("Missing release signing properties: ${missingSigningProperties.join(', ')}")
}

def releaseKeystoreFile = file(signingProperties.getProperty('storeFile'))
if (!releaseKeystoreFile.exists()) {
    throw new GradleException('Release keystore file was not found at the configured local path.')
}

android {
    namespace "com.homelyserv.app"
    compileSdk 36

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }

    defaultConfig {
        applicationId "com.homelyserv.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // This renames the APK to HomelyServ.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "HomelyServ.apk"
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
